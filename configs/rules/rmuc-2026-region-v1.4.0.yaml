schema_version: 1
id: rmuc-2026-region-v1.4.0
season: 2026
competition: RMUC
stage: regional
status: official-partial
official_version: "1.4.0"
source_url: https://bbs.robomaster.com/wiki/20204847/809871?source=7
last_verified: "2026-09-29"
match_duration: 420

economy:
  initial_coins: 400
  periodic_interval: 10
  qualification_modifiers:
    project_document: {S: 50, A: 25, B: 0, C: -25, D: -50}
    technical_solution: {S: 150, A: 75, B: 0, C: -25, D: -50}
  lab_pre_match_rating:
    project_document: B
    technical_solution: B
  immediate_respawn:
    elapsed_interval: 60
    elapsed_step_coins: 80
    level_coins: 20
  timed_grants:
    - {elapsed: 60, coins: 50}
    - {elapsed: 120, coins: 50}
    - {elapsed: 180, coins: 50}
    - {elapsed: 240, coins: 50}
    - {elapsed: 300, coins: 50}
    - {elapsed: 360, coins: 150}

robot_lifecycle:
  disengaged_after: 6
  resupply:
    heal_fraction_per_second: 0.10
    enhanced_after: 240
    enhanced_heal_fraction_per_second: 0.25
  respawn:
    base_progress_required: 10
    elapsed_seconds_per_progress: 10
    immediate_respawn_progress_penalty: 20
    progress_per_second: 1
    accelerated_progress_per_second: 4
    accelerated_base_hp_below: 2000
    hp_fraction: 0.10
    invincibility_duration: 30
    weak_release_min_invincibility: 10
    immediate_hp_fraction: 1.0
    immediate_invincibility_duration: 3
    immediate_power_multiplier: 2.0
    immediate_power_cap: 200
    immediate_power_duration: 4

projectile_allowance:
  remote_effective_delay: 6
  zones:
    red:
      supply: red-supply-buff
      base: red-base-buff
      outpost: red-outpost-buff
    blue:
      supply: blue-supply-buff
      base: blue-base-buff
      outpost: blue-outpost-buff
  initial:
    hero: {projectile: 42mm, allowance: 0}
    infantry: {projectile: 17mm, allowance: 0}
    sentry: {projectile: 17mm, allowance: 300}
    drone: {projectile: 17mm, allowance: 750, additional_acquisition: false}
  purchase:
    17mm:
      team_cap: 1000
      nonremote: {coins: 10, allowance: 10}
      remote: {coins: 150, allowance: 100}
    42mm:
      team_cap: 100
      nonremote: {coins: 10, allowance: 1}
      remote: {coins: 150, allowance: 10}
  sentry_supply:
    interval: 60
    allowance: 100

shooting_heat:
  detection_hz: 10
  per_shot:
    17mm: 10
    42mm: 100
  permanent_margin:
    17mm: 100
    42mm: 200
  sentry:
    mode: automatic
    heat_limit: 260
    cooling_per_second: 30

chassis_power:
  detection_hz: 10
  buffer_energy_max: 60
  power_off_duration: 5
  lab_power_demand:
    stationary: 0
    moving_over_limit: 5

field_defense_buffs:
  occupy_release_delay: 2
  defense:
    base: 0.50
    central: 0.25
    trapezoid: 0.50
    outpost: 0.25
  zones:
    red:
      central: red-central-elevated-buff
      trapezoid: red-trapezoid-buff
    blue:
      central: blue-central-elevated-buff
      trapezoid: blue-trapezoid-buff

terrain_crossing:
  first_experience: 300
  launch_ramp:
    sequence_window: 10
    defense: 0.25
    defense_duration: 30
  elevated_ground:
    sequence_window: 5
    defense: 0.25
    defense_duration: 30
  road:
    sequence_window: 3
    defense: 0.25
    defense_duration: 5
    reacquire_cooldown: 15
  tunnel:
    sequence_window: 3
    defense: 0.50
    defense_duration: 10
    cooling_multiplier: 2.0
    cooling_duration: 120
  zones:
    red:
      road: [red-terrain-road-lower, red-terrain-road-upper]
      elevated_ground: [red-terrain-elevated-lower, red-terrain-elevated-upper]
      launch_ramp: [red-terrain-launch-first, red-terrain-launch-second]
      tunnel: [red-terrain-tunnel-end-a, red-terrain-tunnel-middle, red-terrain-tunnel-end-b]
    blue:
      road: [blue-terrain-road-lower, blue-terrain-road-upper]
      elevated_ground: [blue-terrain-elevated-lower, blue-terrain-elevated-upper]
      launch_ramp: [blue-terrain-launch-first, blue-terrain-launch-second]
      tunnel: [blue-terrain-tunnel-end-a, blue-terrain-tunnel-middle, blue-terrain-tunnel-end-b]

fortress_enemy_occupation:
  available_after: 180
  vulnerability: 1.00
  armor_after: 20
  retention: 3
  eligible_types: [infantry, sentry]

fortress_own_buff:
  defense: 0.50
  cooling_hp_step: 40
  cooling_cap: 75
  eligible_types: [infantry, sentry]
  reserved_projectiles:
    projectile: 17mm
    base: 100
    hp_step: 15
    per_step: 2
    cap: 500
  zones:
    red: red-fortress-buff
    blue: blue-fortress-buff

structures:
  base:
    max_hp: 5000
  outpost:
    max_hp: 1500

outpost_rebuild:
  base_damage_threshold: 1000
  restored_hp: 750
  cutoff_seconds: 300
  durations:
    default: 10
    engineer: 5
  zones:
    red: red-outpost-rebuild
    blue: blue-outpost-rebuild

tech_core:
  leave_zone_fail_after: 15
  zones:
    red:
      resource: red-resource
      assembly: red-assembly
    blue:
      resource: blue-resource
      assembly: blue-assembly
  difficulties:
    1:
      available_after: 0
      prerequisite: null
      first:
        periodic_gold_per_10s: 50
      repeat:
        periodic_gold_per_10s: 5
    2:
      available_after: 60
      prerequisite: 1
      first:
        level_cap: 7
        periodic_gold_per_10s: 25
      repeat:
        periodic_gold_per_10s: 10
    3:
      available_after: 120
      prerequisite: 2
      first:
        level_cap: 10
        defense_bonus: 0.25
        periodic_gold_per_10s: 25
      repeat:
        periodic_gold_per_10s: 15
    4:
      available_after: 180
      prerequisite: 3
      only_once: true
      first:
        defense_bonus: 0.50
        base_hp_bonus: 2000
        periodic_gold_per_10s: 50
      repeat: null
  difficulty4:
    total_window: 45
    paired_step_window: 5
    paired_steps: [2, 3, 5, 6]
    priority_buffer: 15
    retry_lockout: 90
    priority_failure:
      permanent_lockout: true
      periodic_gold_penalty_per_10s: 25

experience:
  level_thresholds:
    - {level: 1, experience: 0}
    - {level: 2, experience: 550}
    - {level: 3, experience: 1100}
    - {level: 4, experience: 1650}
    - {level: 5, experience: 2200}
    - {level: 6, experience: 2750}
    - {level: 7, experience: 3300}
    - {level: 8, experience: 3850}
    - {level: 9, experience: 4400}
    - {level: 10, experience: 5000}
  initial_level_cap: 5
  shot:
    hero: 10
    infantry: 1
  damage:
    robot_per_hp: 4
    outpost_per_hp: 2
    base_hp_per_experience: 2
  kill:
    base_factor: 50
    level_difference_factor: 0.2

performance:
  lab_selection:
    hero:
      profile: long-range-priority
    infantry:
      chassis: hp-priority
      launcher: cooling-priority

  hero:
    close-range-priority:
      - {level: 1, max_hp: 200, chassis_power_limit: 70, heat_limit: 140, cooling_per_second: 12}
      - {level: 2, max_hp: 225, chassis_power_limit: 75, heat_limit: 150, cooling_per_second: 14}
      - {level: 3, max_hp: 250, chassis_power_limit: 80, heat_limit: 160, cooling_per_second: 16}
      - {level: 4, max_hp: 275, chassis_power_limit: 85, heat_limit: 170, cooling_per_second: 18}
      - {level: 5, max_hp: 300, chassis_power_limit: 90, heat_limit: 180, cooling_per_second: 20}
