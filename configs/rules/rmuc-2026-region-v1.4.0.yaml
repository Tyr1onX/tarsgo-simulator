      - {level: 9, max_hp: 400, chassis_power_limit: 110, heat_limit: 220, cooling_per_second: 28}
      - {level: 10, max_hp: 450, chassis_power_limit: 120, heat_limit: 240, cooling_per_second: 30}
    long-range-priority:
      - {level: 1, max_hp: 150, chassis_power_limit: 50, heat_limit: 100, cooling_per_second: 20}
      - {level: 2, max_hp: 165, chassis_power_limit: 55, heat_limit: 102, cooling_per_second: 23}
      - {level: 3, max_hp: 180, chassis_power_limit: 60, heat_limit: 104, cooling_per_second: 26}
      - {level: 4, max_hp: 195, chassis_power_limit: 65, heat_limit: 106, cooling_per_second: 29}
      - {level: 5, max_hp: 210, chassis_power_limit: 70, heat_limit: 108, cooling_per_second: 32}
      - {level: 6, max_hp: 225, chassis_power_limit: 75, heat_limit: 110, cooling_per_second: 35}
      - {level: 7, max_hp: 240, chassis_power_limit: 80, heat_limit: 115, cooling_per_second: 38}
      - {level: 8, max_hp: 255, chassis_power_limit: 85, heat_limit: 120, cooling_per_second: 41}
      - {level: 9, max_hp: 270, chassis_power_limit: 90, heat_limit: 125, cooling_per_second: 44}
      - {level: 10, max_hp: 300, chassis_power_limit: 100, heat_limit: 130, cooling_per_second: 50}

  infantry:
    chassis:
      power-priority:
        - {level: 1, max_hp: 150, chassis_power_limit: 60}
        - {level: 2, max_hp: 175, chassis_power_limit: 65}
        - {level: 3, max_hp: 200, chassis_power_limit: 70}
        - {level: 4, max_hp: 225, chassis_power_limit: 75}
        - {level: 5, max_hp: 250, chassis_power_limit: 80}
        - {level: 6, max_hp: 275, chassis_power_limit: 85}
        - {level: 7, max_hp: 300, chassis_power_limit: 90}
        - {level: 8, max_hp: 325, chassis_power_limit: 95}
        - {level: 9, max_hp: 350, chassis_power_limit: 100}
        - {level: 10, max_hp: 400, chassis_power_limit: 100}
      hp-priority:
        - {level: 1, max_hp: 200, chassis_power_limit: 45}
        - {level: 2, max_hp: 225, chassis_power_limit: 50}
        - {level: 3, max_hp: 250, chassis_power_limit: 55}
        - {level: 4, max_hp: 275, chassis_power_limit: 60}
        - {level: 5, max_hp: 300, chassis_power_limit: 65}
