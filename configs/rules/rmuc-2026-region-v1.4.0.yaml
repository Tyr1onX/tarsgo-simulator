# Rules Lab-only combat timing/direct-damage approximation.
# Hero/Infantry max HP and chassis power come from the selected Performance table.
lab_robot_parameters:
  common:
    move_speed: 190
    collision_radius: 18
    attack_range: 240
    attack_interval: 0.75
  hero:
    damage: 200
    projectile: 42mm
  engineer:
    max_hp: 250
    damage: 0
    projectile: null
    chassis_power_limit: 120
  infantry:
    damage: 20
    projectile: 17mm
  sentry:
    max_hp: 400
    damage: 20
    projectile: 17mm
    chassis_power_limit: 100
