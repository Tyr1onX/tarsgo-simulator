schema_version: 1
id: rmuc-2027-region-v1.0.0
status: rules-lab-partial
competition: RMUC
season: 2027
format: regional
official_version: V1.0.0
source_url: null
last_verified: "2026-10-15"
stage: regional

# RMUC 2027 Competition Rules V1.0.0, §3 Tables 3-1 and 3-2.
# Combination systems are roster entries, not ordinary ground Robot instances.
active_roster:
  ground:
    heavy: 1
    infantry: 2
    sentry: 1
  systems:
    air:
      hangar: 1
      aircraft: 4
    dart:
      launcher: 1
      dart_bodies: 4
    radar:
      computing_platform: 1
      sensor: 1

# §6.6. Official duration. P2c will add official settlement.
match_duration: 420

# Rules Lab movement values only. V1.0.0 does not set a simulator speed;
# movement is enabled so gainpoint activation is reached through match ticks.
rules_lab_placeholder:
  max_hp: 1
  move_speed: 1500
  collision_radius: 200
  attack_range: 0
  attack_interval: 1
  damage: 0

# RMUC 2027 Competition Rules V1.0.0 §§3.1.3, 4.5.2, 5.1.1 Table 5-1,
# 5.1.1 Table 5-2, and 5.6.1. HP, damage, hit-speed threshold, and initial
# sentry ammunition are official. Projectile speed/range/rate are isolated
# Rules Lab values inside the official legal speed and detection constraints.
structures:
  base:
    max_hp: 10000
  outpost:
    max_hp: 1000
rules_lab_structure_attack:
  sentry_initial_17mm_ammo: 300
  structure_hit_damage_17mm: 20
  minimum_effective_speed_mm_s: 12000
  projectile_speed_mm_s: 13000
  firing_interval_seconds: 0.05
  effective_range_mm: 7000

# RMUC 2027 Competition Rules V1.0.0 §5.6.2 and Table 5-21.
# Card polygons are separately sourced and marked approximate in the field file.
territory_control:
  capture_seconds: 5
  activation_invalidation_delay_seconds: 2
  territories:
    red-outpost:
      kind: outpost
      initial_side: red
      gainpoints: [red-outpost-point, red-central-highland-point]
    blue-outpost:
      kind: outpost
      initial_side: blue
      gainpoints: [blue-outpost-point, blue-central-highland-point]
    red-base:
      kind: base
      initial_side: red
      gainpoints: [red-base-point, red-fortress-point]
    blue-base:
      kind: base
      initial_side: blue
      gainpoints: [blue-base-point, blue-fortress-point]

unimplemented:
  - "§5.6.2 control-degree accumulation and scoring eligibility"
  - "§5.8 victory and timeout settlement"
  - "§5.6.1 outpost rotation stop on opposing base armor deployment; waiting for base-armor activation behavior"
  - "17mm fire from infantry/heavy and robot-vs-robot damage"
  - "official weapon cadence, heat, ammunition purchases, and projectile trajectories"
  - "economy, mechanisms, and robot abilities"
  - "official 2027 field geometry, terrain, and collision model"
