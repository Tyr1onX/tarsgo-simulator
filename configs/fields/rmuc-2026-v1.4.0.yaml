id: rmuc-2026-v1.4.0
units: mm
source:
  title: RoboMaster 2026 RMUC Competition Rules V1.4.0
  url: https://bbs-web-static.robomaster.com/38afa6d7914345f7bb5d496692fd429b1773977681621/RoboMaster%202026%20%E6%9C%BA%E7%94%B2%E5%A4%A7%E5%B8%88%E8%B6%85%E7%BA%A7%E5%AF%B9%E6%8A%97%E8%B5%9B%E6%AF%94%E8%B5%9B%E8%A7%84%E5%88%99%E6%89%8B%E5%86%8CV1.4.0%EF%BC%8820260320%EF%BC%89.pdf
  dimensions:
    field: "§4.1, Figure 4-5, pp.31, 35"
    base: "Figure 4-5 and Figure 4-9, pp.35, 39"
    outpost: "Figure 4-5 and Figure 4-33, pp.35, 60"
    start_zone: "Figure 4-8, p.38"
    interaction_regions: "Figure 5-23, p.106"
  limitations:
    - "The field manual states 28 m × 15 m. Coordinates use the upper-left playing-surface corner as origin, x along the 28 m edge, y along the 15 m edge."
    - "Figure 5-23 is explicitly a distribution diagram and does not dimension RFID-card edges. Region projections are traced from that official diagram; exact card boundaries remain deferred."
    - "The map is a 2D plan projection. Elevations, ramps, tunnels, steps, overhangs and traversability by height remain deferred until the manual provides a verified 2.5D model."
    - "Figure 4-5 states that long-edge field slopes are 1°–2° from the centerline; elevation and slope physics are deferred."
    - "The drawing gives the Outpost body diameter but not a fully dimensioned platform plan. The body circle is modeled; the supporting platform footprint remains deferred."
size_mm:
  length: 28000
  width: 15000
team_symmetry: rotate_180

# Red-side centers are taken from the field positioning drawing; blue-side
# geometry is generated by the manual's center-symmetric field layout.
structures:
  - side: red
    type: base
    position: [2407, 7500]
    footprint:
      shape: polygon
      width: 1881
      height: 1609
      # Figure 4-9: 1089 mm flat edges and 1881 x 1609 mm outer dimensions.
      points: [[-544.5, -804.5], [544.5, -804.5], [940.5, 0], [544.5, 804.5], [-544.5, 804.5], [-940.5, 0]]
  - side: red
    type: outpost
    position: [6600, 7500]
    footprint: {shape: circle, width: 550, height: 550}

# Area outlines are 2D plan projections of the official placement diagrams.
# Figure 5-23 does not publish interaction-card dimensions; those edges are
# intentionally not described as surveyed/production field coordinates.
zones:
  - id: red-start
    points: [[2407, 5547], [4499.5, 6523.5], [4499.5, 8476.5], [2407, 9453], [314.5, 8476.5], [314.5, 6523.5]]
  - id: red-resource
    points: [[1100, 11200], [3850, 11200], [3850, 14500], [1100, 14500]]
  - id: red-assembly
    points: [[7900, 11700], [9750, 11700], [9750, 13400], [7900, 13400]]
  - id: red-outpost-rebuild
    points: [[5850, 6450], [6600, 6050], [7350, 6450], [7350, 8550], [6600, 8950], [5850, 8550]]
  - id: red-supply-buff
    points: [[1250, 11500], [3950, 11500], [3950, 14600], [1250, 14600]]
  - id: red-base-buff
    points: [[2407, 5650], [4100, 6550], [4100, 8450], [2407, 9350], [800, 8450], [800, 6550]]
  - id: red-outpost-buff
    points: [[5700, 6500], [6600, 6000], [7500, 6500], [7500, 8500], [6600, 9000], [5700, 8500]]
  - id: red-central-elevated-buff
    points: [[9200, 2800], [10300, 3000], [11800, 6200], [10800, 7300], [9600, 6100]]
  - id: red-trapezoid-buff
    points: [[1800, 2800], [4100, 2800], [4100, 4300], [1800, 4300]]
  - id: red-fortress-buff
    points: [[1800, 11300], [4050, 11300], [4050, 12500], [1800, 12500]]
  - id: red-terrain-road-lower
    points: [[8500, 12800], [9000, 12800], [9000, 13300], [8500, 13300]]
  - id: red-terrain-road-upper
    points: [[10100, 11900], [10600, 11900], [10600, 12400], [10100, 12400]]
  - id: red-terrain-elevated-lower
    points: [[8800, 6800], [9300, 6800], [9300, 7300], [8800, 7300]]
  - id: red-terrain-elevated-upper
    points: [[10400, 4700], [10900, 4700], [10900, 5200], [10400, 5200]]
  - id: red-terrain-launch-first
    points: [[7200, 9500], [7700, 9500], [7700, 10000], [7200, 10000]]
  - id: red-terrain-launch-second
    points: [[8500, 10100], [9000, 10100], [9000, 10600], [8500, 10600]]
  - id: red-terrain-tunnel-end-a
    points: [[7300, 3200], [7800, 3200], [7800, 3700], [7300, 3700]]
  - id: red-terrain-tunnel-middle
    points: [[8500, 3200], [9000, 3200], [9000, 3700], [8500, 3700]]
  - id: red-terrain-tunnel-end-b
    points: [[9700, 3200], [10200, 3200], [10200, 3700], [9700, 3700]]

# Terrain descriptions are symbolic until their complete XY footprints and
# portal coordinates can be bound to the canonical mm field. They do not add
# collision, LOS, movement, or gameplay effects.
obstacles: []

# Confirmed by the V1.4.0 module diagrams and terrain descriptions. Heights
# and grades are metadata only; symbolic A* routes can cross layers only by
# these explicit ramp/tunnel nodes. The current diagrams do not provide every
# portal coordinate needed to constrain the live XY path grid.
terrain:
  features:
    - {id: field-ground, kind: ground, source: "§4.1, p.31"}
    - {id: north-road, kind: surface, source: "§4.3.2, Figure 4-27, p.55"}
    - {id: south-road, kind: surface, source: "§4.3.2, Figure 4-27, p.55"}
    - {id: central-highland, kind: elevated, source: "§4.3.2, Figure 4-27, p.55"}
    - {id: central-ramp-north, kind: ramp, slope_degrees: 10.5, source: "§4.3.2, Figure 4-27, p.55"}
    - {id: central-ramp-south, kind: ramp, slope_degrees: 10.5, source: "§4.3.2, Figure 4-27, p.55; center symmetry, §4.1, p.31"}
    - {id: red-trapezoid-highland, kind: elevated, relative_height_mm: [200, 400], source: "§4.3.1, p.53"}
    - {id: red-trapezoid-ramp-steep, kind: ramp, slope_degrees: 43, source: "Figure 4-26, p.54"}
    - {id: red-trapezoid-ramp-shallow, kind: ramp, slope_degrees: 23, source: "Figure 4-26, p.54"}
    - {id: fortress-ramp, kind: ramp, slope_degrees: 20, source: "Figure 4-25, p.53"}
    - {id: assembly-slope-red-outer, kind: ramp, slope_degrees: 14, source: "Figure 4-28, p.56"}
    - {id: assembly-slope-red-inner, kind: ramp, slope_degrees: 12, source: "Figure 4-28, p.56"}
    - {id: assembly-slope-blue-inner, kind: ramp, slope_degrees: 45, source: "Figure 4-28, p.56"}
    - {id: assembly-slope-blue-outer, kind: ramp, slope_degrees: 15, source: "Figure 4-28, p.56"}
    - {id: blue-trapezoid-highland, kind: elevated, relative_height_mm: [200, 400], source: "§4.3.1, p.53; center symmetry, §4.1, p.31"}
    - {id: blue-trapezoid-ramp-steep, kind: ramp, slope_degrees: 43, source: "Figure 4-26, p.54; center symmetry, §4.1, p.31"}
    - {id: blue-trapezoid-ramp-shallow, kind: ramp, slope_degrees: 23, source: "Figure 4-26, p.54; center symmetry, §4.1, p.31"}
    - {id: road-tunnel-west-entry, kind: surface, source: "Figure 4-4 and Figure 4-34, pp.34, 61"}
    - {id: road-tunnel-west-exit, kind: surface, source: "Figure 4-4 and Figure 4-34, pp.34, 61"}
    - {id: road-tunnel-west-passage, kind: tunnel, source: "§4.4, Figure 4-34, p.61"}
    - {id: road-tunnel-east-entry, kind: surface, source: "Figure 4-4 and Figure 4-34, pp.34, 61"}
    - {id: road-tunnel-east-exit, kind: surface, source: "Figure 4-4 and Figure 4-34, pp.34, 61"}
    - {id: road-tunnel-east-passage, kind: tunnel, source: "§4.4, Figure 4-34, p.61"}
    - {id: road-ramp-11, kind: ramp, slope_degrees: 11, source: "Figure 4-34, p.61"}
    - {id: road-ramp-15, kind: ramp, slope_degrees: 15, source: "Figure 4-34, p.61"}
    - {id: fly-slope, kind: ramp, slope_degrees: 17, source: "§4.4.2, Figure 4-37, p.63"}
  connections:
    - {from: north-road, to: central-highland, via: central-ramp-north}
    - {from: south-road, to: central-highland, via: central-ramp-south}
    - {from: road-tunnel-west-entry, to: road-tunnel-west-exit, via: road-tunnel-west-passage}
    - {from: road-tunnel-east-entry, to: road-tunnel-east-exit, via: road-tunnel-east-passage}

deferred:
  - "Undimensioned field module edges and interaction-card extents beyond the plan projections above."
  - "2D collision edges for bridges, roads, ramps, tunnels and elevated modules until their complete plan footprints are dimensioned."
  - "Binding symbolic terrain layers and connectors to exact XY footprints and portal coordinates in the movement A* grid."
  - "Traversability from field ground onto the trapezoid highlands: the drawings specify ramp angles and elevation, but the text does not establish robot-accessible paths."
  - "Height-dependent collision/line-of-sight, central-highland absolute height, tunnel clearance, step height and bridge/overhang geometry."
  - "Jump trajectory and airborne movement over the road fly slope. Drone flight-area and height constraints remain separate from ground terrain."
  - "Exact Outpost platform footprint; only the 550 mm body circle is used for 2D blocking."
