schema_version: 1
rules: rmuc-2026-region-v1.4.0
player_team: tarsgo-rmuc-2026-region
player_controlled:
  - tarsgo-hero
  - tarsgo-engineer
  - tarsgo-infantry-1
  - tarsgo-infantry-2
learning_goals:
  - 验证 RMUC 2026 区域赛 V1.4.0 的基地与前哨站核心生命周期
  - 观察基地累计损伤带来的前哨站重建机会与 5 秒/10 秒独立占领进度
  - 验证七分钟比赛结束与基地被毁后的胜负链
  - 体验 Engineer Energy Unit 与 Tech Core D1-D4 对 team level cap / economy 的影响
  - 体验 17mm / 42mm 允许发弹量、本地/远程金币兑换与 Sentry 补给累积
  - 验证 Base / Central / Trapezoid / Outpost 静态 Defense Buff Point 占领语义
  - 验证 Road / Elevated Ground / Launch Ramp / Tunnel Terrain Crossing Buff 顺序与持续时间
  - 验证己方 Fortress 启用、单机器人占领、50% Defense 与动态 Shooting Heat Cooling
