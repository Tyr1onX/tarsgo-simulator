name: Build desktop apps

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            data_separator: ";"
            icon_format: ico
          - os: macos-latest
            platform: macos
            data_separator: ":"
            icon_format: icns
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Generate application icons
        run: python -m tarsgo_simulator.desktop.icon --output-dir build/app-icons
      - name: Build application
        run: python -m PyInstaller --noconfirm --clean --windowed --name "TARS-Go-Simulator" --icon "build/app-icons/tarsgo.${{ matrix.icon_format }}" --add-data "configs${{ matrix.data_separator }}configs" --add-data "assets${{ matrix.data_separator }}assets" run_game.py
      - name: Verify packaged RMUC art
        run: |
          python -c "from pathlib import Path; files=list(Path('dist').rglob('*.png')); names={p.name for p in files}; required={'floor-surface.png','base.png','outpost.png'}; missing=required-names; assert not missing, f'Missing packaged RMUC assets: {sorted(missing)}'"
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "dist/TARS-Go-Simulator.app" "TARS-Go-Simulator-macos.zip"
      - name: Upload Windows executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: TARS-Go-Simulator-windows
          path: dist/TARS-Go-Simulator/TARS-Go-Simulator.exe
          if-no-files-found: error
      - name: Upload macOS application
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: TARS-Go-Simulator-macos
          path: TARS-Go-Simulator-macos.zip
          if-no-files-found: error
