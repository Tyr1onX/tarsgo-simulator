name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q src tests run_game.py
      - name: Check diff whitespace
        run: git diff --check origin/main...HEAD
      - name: Smoke all rules modes
        run: |
          python -c "from tarsgo_simulator.core.match import Match; m=Match.from_scenario('configs/scenarios/first-steps.yaml'); m.update(0.01)"
          python -c "from tarsgo_simulator.core.match import Match; m=Match.from_scenario('configs/scenarios/rmul-2026-rules-lab.yaml'); m.update(0.01)"
          python -c "from tarsgo_simulator.core.match import Match; m=Match.from_scenario('configs/scenarios/rmuc-2026-region-rules-lab.yaml'); m.update(0.01)"
      - name: Run tests
        run: python -m pytest
