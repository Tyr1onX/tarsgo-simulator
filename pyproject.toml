[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tarsgo-simulator"
version = "0.1.0"
description = "TARS-Go RoboMaster tactical training simulator"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "pygame>=2.6.1,<3",
  "PyYAML>=6.0,<7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
